<!DOCTYPE html>
<html lang="es">
<head id="app-head"></head>
<body>
<div id="app"></div>
<div id="global-layers"></div>

<script type="module">
  async function loadPartial(path) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(`No se pudo cargar ${path}`);
    return response.text();
  }

  async function bootstrap() {
    const [headHtml, topStatusHtml, topBrandHtml, topNavHtml, centerStatsHtml, centerActionsHtml, centerLogHtml, overlaysModalsHtml, overlaysTooltipsHtml, overlaysAlertsHtml] = await Promise.all([
      loadPartial('partials/head.html'),
      loadPartial('partials/hud-top/status.html'),
      loadPartial('partials/hud-top/brand.html'),
      loadPartial('partials/hud-top/nav.html'),
      loadPartial('partials/hud-center-bottom/stats.html'),
      loadPartial('partials/hud-center-bottom/actions.html'),
      loadPartial('partials/hud-center-bottom/log.html'),
      loadPartial('partials/overlays/modals.html'),
      loadPartial('partials/overlays/tooltips.html'),
      loadPartial('partials/overlays/alerts.html'),
    ]);

    document.getElementById('app-head').innerHTML = headHtml;
    document.getElementById('app').innerHTML = `<section id="hud-top">${topStatusHtml}${topBrandHtml}${topNavHtml}</section>${centerStatsHtml}${centerActionsHtml}${centerLogHtml}`;
    document.getElementById('global-layers').innerHTML = `<div class="particle-container" id="particleContainer"></div>${overlaysModalsHtml}${overlaysTooltipsHtml}${overlaysAlertsHtml}`;

    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'js/main.js';
    document.body.appendChild(script);
  }

  bootstrap().catch((error) => {
    console.error(error);
    document.body.innerHTML = '<p style="color:#fff;background:#111;padding:1rem">Error cargando la interfaz. Verifica que uses un servidor local.</p>';
  });
</script>
</body>
</html>
