<!DOCTYPE html>
<html lang="es">
<head id="app-head"></head>
<body>
<div id="app"></div>
<div id="global-layers"></div>

<script type="module">
  async function loadPartial(path) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(`No se pudo cargar ${path}`);
    return response.text();
  }

  async function bootstrap() {
    const [headHtml, topHtml, centerBottomHtml, overlaysHtml] = await Promise.all([
      loadPartial('partials/head.html'),
      loadPartial('partials/hud-top.html'),
      loadPartial('partials/hud-center-bottom.html'),
      loadPartial('partials/overlays.html'),
    ]);

    document.getElementById('app-head').innerHTML = headHtml;
    document.getElementById('app').innerHTML = `${topHtml}${centerBottomHtml}`;
    document.getElementById('global-layers').innerHTML = overlaysHtml;

    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'js/main.js';
    document.body.appendChild(script);
  }

  bootstrap().catch((error) => {
    console.error(error);
    document.body.innerHTML = '<p style="color:#fff;background:#111;padding:1rem">Error cargando la interfaz. Verifica que uses un servidor local.</p>';
  });
</script>
</body>
</html>
