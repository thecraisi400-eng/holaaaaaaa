
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
.ninja-root{width:460px;height:360px;background:#0d1117;border:1px solid #1e2d44;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;font-family:'Rajdhani',sans-serif;position:relative;}
.title-bar{background:linear-gradient(90deg,#0d1117,#131a26,#0d1117);border-bottom:1px solid #1a3a5c;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.title-bar h1{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;color:#4cc9f0;text-transform:uppercase;}
.res-display{display:flex;gap:10px;font-size:10px;}
.res-item{display:flex;align-items:center;gap:4px;color:#8899aa;}
.res-val{color:#f0c040;font-weight:700;font-family:'Orbitron',monospace;font-size:10px;}
.main-content{display:flex;flex:1;overflow:hidden;}
.lib-panel{width:200px;padding:8px;border-right:1px solid #1a3a5c;display:flex;flex-direction:column;flex-shrink:0;}
.lib-label{font-size:9px;letter-spacing:2px;color:#4cc9f0;text-transform:uppercase;margin-bottom:6px;text-align:center;opacity:0.7;}
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;flex:1;}
.skill-card{background:#131a26;border:1px solid #1e2d44;border-radius:4px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all 0.15s;user-select:none;}
.skill-card:hover{border-color:#4cc9f0;background:#1a2a3a;transform:scale(1.04);}
.skill-card.dragging{opacity:0.4;transform:scale(0.9);}
.skill-card .sk-icon{font-size:22px;line-height:1;}
.skill-card .sk-name{font-size:8px;color:#7899aa;text-align:center;margin-top:2px;line-height:1.1;padding:0 2px;}
.skill-card .sk-lvl{position:absolute;top:2px;right:3px;font-size:8px;font-family:'Orbitron',monospace;color:#4cc9f0;}
.skill-card.tier-silver{border-color:#8899cc;box-shadow:0 0 6px rgba(136,153,204,0.3);}
.skill-card.tier-sennin{border-color:#f0c040;box-shadow:0 0 10px rgba(240,192,64,0.5);animation:senninPulse 2s infinite;}
@keyframes senninPulse{0%,100%{box-shadow:0 0 8px rgba(240,192,64,0.4);}50%{box-shadow:0 0 18px rgba(240,192,64,0.8);}}
.slot-panel{flex:1;padding:8px 6px;display:flex;flex-direction:column;gap:6px;justify-content:center;}
.slot-label-top{font-size:9px;letter-spacing:2px;color:#4cc9f0;text-transform:uppercase;text-align:center;opacity:0.7;margin-bottom:2px;}
.slot-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.slot-ring{width:72px;height:72px;border-radius:50%;border:2px solid #1a3a5c;background:#131a26;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:all 0.2s;}
.slot-ring.empty{animation:chakraPulse 2s ease-in-out infinite;}
.slot-ring.filled{border-color:#4cc9f0;background:#0a1520;}
.slot-ring.filled:hover{border-color:#7ef4ff;}
.slot-ring.shake{animation:shakeFail 0.4s ease-in-out;}
@keyframes chakraPulse{0%,100%{border-color:#1a3a5c;box-shadow:0 0 0 0 rgba(76,201,240,0);}50%{border-color:#2a5a8c;box-shadow:0 0 0 6px rgba(76,201,240,0.12);}}
@keyframes shakeFail{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-5px);}40%,80%{transform:translateX(5px);}border-color:#ff3333;}
.slot-ring.slot-error{border-color:#ff3344!important;box-shadow:0 0 12px rgba(255,51,68,0.5)!important;}
.slot-inner{font-size:30px;text-align:center;line-height:1;}
.slot-sub{font-size:8px;color:#4a6a88;text-align:center;letter-spacing:1px;text-transform:uppercase;}
.slot-clear{font-size:9px;color:#ff4466;cursor:pointer;margin-top:1px;opacity:0;transition:opacity 0.2s;}
.slot-wrap:hover .slot-clear{opacity:1;}
.particles{position:absolute;pointer-events:none;z-index:100;}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#4cc9f0;animation:particleOut 0.6s ease-out forwards;}
@keyframes particleOut{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);}}
.detail-popup{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:430px;background:#0d1520;border:1px solid #2a5a8c;border-radius:6px;padding:10px 12px;z-index:200;display:none;box-shadow:0 0 20px rgba(76,201,240,0.15);}
.detail-popup.visible{display:block;animation:popIn 0.15s ease;}
@keyframes popIn{from{opacity:0;transform:translateX(-50%) translateY(6px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.popup-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.popup-icon{font-size:24px;}
.popup-name{font-family:'Orbitron',monospace;font-size:12px;color:#4cc9f0;letter-spacing:1px;}
.popup-lvl{font-size:10px;color:#f0c040;font-family:'Orbitron',monospace;margin-left:auto;}
.popup-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.stat-box{background:#131a26;border:1px solid #1e2d44;border-radius:4px;padding:5px 6px;}
.stat-box .st-label{font-size:8px;color:#4a6a88;text-transform:uppercase;letter-spacing:1px;}
.stat-box .st-val{font-size:10px;color:#cce4ff;font-weight:600;margin-top:2px;}
.popup-passive{background:#1a2a1a;border:1px solid #2a5a2a;border-radius:4px;padding:5px 8px;font-size:9px;color:#66cc88;margin-bottom:8px;display:none;}
.popup-passive.visible{display:block;}
.popup-actions{display:flex;gap:6px;}
.btn-upgrade{flex:1;background:#1a2a3a;border:1px solid #2a5a8c;color:#4cc9f0;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;padding:5px;border-radius:4px;cursor:pointer;text-transform:uppercase;transition:all 0.15s;}
.btn-upgrade:hover{background:#2a4a6a;border-color:#4cc9f0;}
.btn-equip{flex:1;background:#1a3a1a;border:1px solid #2a6a2a;color:#66cc88;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;padding:5px;border-radius:4px;cursor:pointer;text-transform:uppercase;transition:all 0.15s;}
.btn-equip:hover{background:#2a5a2a;border-color:#66cc88;}
.btn-close{background:#2a1a1a;border:1px solid #5a2a2a;color:#ff6688;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;padding:5px 8px;border-radius:4px;cursor:pointer;}
.btn-close:hover{background:#3a1a1a;}
.toast{position:absolute;top:38px;right:8px;background:#1a0a0a;border:1px solid #ff3344;color:#ff6688;font-size:9px;letter-spacing:1px;padding:4px 8px;border-radius:4px;z-index:300;opacity:0;transition:opacity 0.2s;pointer-events:none;}
.toast.show{opacity:1;}
.drag-ghost{position:fixed;pointer-events:none;z-index:9999;font-size:28px;transform:translate(-50%,-50%);}
</style>

<div class="ninja-root" id="ninjaRoot">
  <div class="title-bar">
    <h1>⟨ Sistema de Jutsus ⟩</h1>
    <div class="res-display">
      <span class="res-item">📜 <span class="res-val" id="scrolls">48</span></span>
      <span class="res-item">⚡ <span class="res-val" id="chakra">320</span></span>
    </div>
  </div>
  <div class="main-content">
    <div class="lib-panel">
      <div class="lib-label">Biblioteca</div>
      <div class="skill-grid" id="skillGrid"></div>
    </div>
    <div class="slot-panel">
      <div class="slot-label-top">Ranuras de Equipo</div>
      <div class="slot-wrap">
        <div class="slot-ring empty" id="slot0" data-slot="0">
          <div class="slot-inner" id="slotContent0">✦</div>
        </div>
        <div class="slot-sub" id="slotLabel0">Jutsu Primario</div>
        <div class="slot-clear" onclick="clearSlot(0)">✕ retirar</div>
      </div>
      <div class="slot-wrap">
        <div class="slot-ring empty" id="slot1" data-slot="1">
          <div class="slot-inner" id="slotContent1">✦</div>
        </div>
        <div class="slot-sub" id="slotLabel1">Jutsu Secundario</div>
        <div class="slot-clear" onclick="clearSlot(1)">✕ retirar</div>
      </div>
      <div class="slot-wrap">
        <div class="slot-ring empty" id="slot2" data-slot="2">
          <div class="slot-inner" id="slotContent2">✦</div>
        </div>
        <div class="slot-sub" id="slotLabel2">Jutsu Terciario</div>
        <div class="slot-clear" onclick="clearSlot(2)">✕ retirar</div>
      </div>
    </div>
  </div>
  <div class="detail-popup" id="detailPopup">
    <div class="popup-header">
      <span class="popup-icon" id="popIcon"></span>
      <span class="popup-name" id="popName"></span>
      <span class="popup-lvl" id="popLvl"></span>
    </div>
    <div class="popup-stats">
      <div class="stat-box"><div class="st-label">Daño</div><div class="st-val" id="popDmg"></div></div>
      <div class="stat-box"><div class="st-label">Efecto</div><div class="st-val" id="popEffect"></div></div>
      <div class="stat-box"><div class="st-label">Buff</div><div class="st-val" id="popBuff"></div></div>
    </div>
    <div class="popup-passive" id="popPassive">⚡ Efecto Pasivo Desbloqueado</div>
    <div class="popup-actions">
      <button class="btn-upgrade" id="btnUpgrade" onclick="upgradeJutsu()">⬆ Mejorar</button>
      <button class="btn-equip" id="btnEquip" onclick="equipFromPopup()">◉ Equipar</button>
      <button class="btn-close" onclick="closePopup()">✕</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const jutsus=[
  {id:0,name:"Llama Voraz",icon:"🔥",dmg:"Fuego DOT",effect:"Ceguera -30% puntería",buff:"+10% Atk físico",dur:"3s",lvl:1},
  {id:1,name:"Rayo Destellante",icon:"⚡",dmg:"Daño eléctrico",effect:"Parálisis -80% vel",buff:"+15% Evasión",dur:"2s",lvl:1},
  {id:2,name:"Ráfaga Cortante",icon:"🌀",dmg:"Daño de corte",effect:"Hemorragia",buff:"+Vel ataque",dur:"2s",lvl:1},
  {id:3,name:"Prisión Hidráulica",icon:"💧",dmg:"Daño presión",effect:"Asfixia: no skills",buff:"-Cooldowns",dur:"3s",lvl:1},
  {id:4,name:"Escudo Telúrico",icon:"🪨",dmg:"Daño impacto",effect:"Pesadez: no saltos",buff:"Inmune a empujones",dur:"3s",lvl:1},
  {id:5,name:"Sello Prohibido",icon:"🔮",dmg:"Daño espiritual",effect:"Silencio especiales",buff:"+5% Chakra",dur:"2s",lvl:1},
  {id:6,name:"Espejismo Mental",icon:"🌫️",dmg:"Daño mental",effect:"Controles inv.",buff:"Invisibilidad",dur:"2s",lvl:1},
  {id:7,name:"Bosque Viviente",icon:"🌿",dmg:"Daño raíces",effect:"Drenado energía",buff:"Curación const.",dur:"3s",lvl:1},
  {id:8,name:"Impacto Brutal",icon:"💥",dmg:"Daño físico mas.",effect:"Aturdimiento",buff:"Próx. golpe crit.",dur:"2s",lvl:1},
  {id:9,name:"Aliento Vital",icon:"🌊",dmg:"Daño sónico",effect:"Sordera -20% def",buff:"Limpia debuffs",dur:"3s",lvl:1}
];
const MAX_LVL=10;
const slots=[null,null,null];
let selectedJutsu=null;
let dragJutsuId=null;
let ghostEl=null;
let scrolls=48,chakraRes=320;
function tierClass(lvl){if(lvl>=MAX_LVL)return'tier-sennin';if(lvl>=6)return'tier-silver';return'';}
function renderGrid(){
  const grid=document.getElementById('skillGrid');
  grid.innerHTML='';
  jutsus.forEach(j=>{
    const div=document.createElement('div');
    div.className='skill-card '+tierClass(j.lvl);
    div.innerHTML=`<span class="sk-icon">${j.icon}</span><span class="sk-name">${j.name}</span><span class="sk-lvl">${j.lvl>=MAX_LVL?'MAX':j.lvl}</span>`;
    div.addEventListener('click',()=>openPopup(j.id));
    div.addEventListener('mousedown',(e)=>startDrag(e,j.id));
    grid.appendChild(div);
  });
}
function openPopup(id){
  selectedJutsu=id;
  const j=jutsus[id];
  document.getElementById('popIcon').textContent=j.icon;
  document.getElementById('popName').textContent=j.name;
  document.getElementById('popLvl').textContent='LVL '+(j.lvl>=MAX_LVL?'SENNIN MAX':j.lvl);
  document.getElementById('popDmg').textContent=j.dmg;
  document.getElementById('popEffect').textContent=j.effect;
  document.getElementById('popBuff').textContent=j.buff;
  const passive=document.getElementById('popPassive');
  if(j.lvl>=MAX_LVL){passive.classList.add('visible');}else{passive.classList.remove('visible');}
  document.getElementById('detailPopup').classList.add('visible');
}
function closePopup(){document.getElementById('detailPopup').classList.remove('visible');selectedJutsu=null;}
function upgradeJutsu(){
  if(selectedJutsu===null)return;
  const j=jutsus[selectedJutsu];
  if(j.lvl>=MAX_LVL){showToast('¡Ya es nivel Sennin!');return;}
  const cost={scrolls:5,chakra:30};
  if(scrolls<cost.scrolls||chakraRes<cost.chakra){showToast('Recursos insuficientes');return;}
  scrolls-=cost.scrolls;chakraRes-=cost.chakra;
  j.lvl++;
  document.getElementById('scrolls').textContent=scrolls;
  document.getElementById('chakra').textContent=chakraRes;
  renderGrid();
  openPopup(selectedJutsu);
  showToast('¡'+j.name+' mejorado a Lv'+j.lvl+'!');
}
function equipFromPopup(){
  if(selectedJutsu===null)return;
  equipJutsuToSlot(selectedJutsu,findFreeSlot());
  closePopup();
}
function findFreeSlot(){for(let i=0;i<3;i++){if(slots[i]===null)return i;}return 2;}
function equipJutsuToSlot(jutsuId,slotIdx){
  const prevFull=slots.filter(s=>s!==null).length;
  if(prevFull===3&&slots[slotIdx]!==null){
    const slotEl=document.getElementById('slot'+slotIdx);
    slotEl.classList.add('slot-error','shake');
    setTimeout(()=>{slotEl.classList.remove('shake');slotEl.classList.remove('slot-error');},450);
    setTimeout(()=>doEquip(jutsuId,slotIdx),100);
    showToast('¡Slot lleno! Reemplazando slot '+( slotIdx+1));
  } else {
    doEquip(jutsuId,slotIdx);
  }
}
function doEquip(jutsuId,slotIdx){
  slots[slotIdx]=jutsuId;
  renderSlots();
  spawnParticles(slotIdx);
}
function renderSlots(){
  const names=["Jutsu Primario","Jutsu Secundario","Jutsu Terciario"];
  for(let i=0;i<3;i++){
    const el=document.getElementById('slot'+i);
    const content=document.getElementById('slotContent'+i);
    if(slots[i]!==null){
      const j=jutsus[slots[i]];
      content.textContent=j.icon;
      el.classList.remove('empty');el.classList.add('filled');
      el.onclick=()=>openPopup(slots[i]);
    } else {
      content.textContent='✦';
      el.classList.add('empty');el.classList.remove('filled');
      el.onclick=null;
    }
    document.getElementById('slotLabel'+i).textContent=names[i];
  }
}
function clearSlot(idx){slots[idx]=null;renderSlots();}
function spawnParticles(slotIdx){
  const el=document.getElementById('slot'+slotIdx);
  const rect=el.getBoundingClientRect();
  const rootRect=document.getElementById('ninjaRoot').getBoundingClientRect();
  const cx=rect.left-rootRect.left+rect.width/2;
  const cy=rect.top-rootRect.top+rect.height/2;
  const container=document.getElementById('ninjaRoot');
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='particle';
    const angle=Math.random()*Math.PI*2;
    const dist=30+Math.random()*30;
    p.style.cssText=`left:${cx}px;top:${cy}px;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;background:${Math.random()>0.5?'#4cc9f0':'#f0c040'};animation-delay:${Math.random()*0.1}s;`;
    container.appendChild(p);
    setTimeout(()=>p.remove(),700);
  }
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function startDrag(e,id){
  dragJutsuId=id;
  const j=jutsus[id];
  ghostEl=document.createElement('div');
  ghostEl.className='drag-ghost';
  ghostEl.textContent=j.icon;
  ghostEl.style.left=e.clientX+'px';
  ghostEl.style.top=e.clientY+'px';
  document.body.appendChild(ghostEl);
  document.addEventListener('mousemove',onDrag);
  document.addEventListener('mouseup',endDrag);
  e.preventDefault();
}
function onDrag(e){
  if(ghostEl){ghostEl.style.left=e.clientX+'px';ghostEl.style.top=e.clientY+'px';}
}
function endDrag(e){
  document.removeEventListener('mousemove',onDrag);
  document.removeEventListener('mouseup',endDrag);
  if(ghostEl){ghostEl.remove();ghostEl=null;}
  for(let i=0;i<3;i++){
    const el=document.getElementById('slot'+i);
    const rect=el.getBoundingClientRect();
    if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom){
      equipJutsuToSlot(dragJutsuId,i);
      dragJutsuId=null;return;
    }
  }
  dragJutsuId=null;
}
renderGrid();renderSlots();
</script>
