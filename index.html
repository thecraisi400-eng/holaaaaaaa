<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Premium Ninja Tech – HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="html-parts-root"></div>
<script>
(async function loadHtmlParts() {
  const root = document.getElementById('html-parts-root');
  const parts = ['index-part1.html', 'index-part2.html', 'index-part3.html', 'index-part4.html'];
  for (const file of parts) {
    const res = await fetch(file);
    root.insertAdjacentHTML('beforeend', await res.text());
  }
  const script = document.createElement('script');
  script.src = 'script.js';
  document.body.appendChild(script);
})();
</script>
</body>
</html>
