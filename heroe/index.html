<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Shinobi Sheet - Heroe</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="sheet" id="sheet">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="col-identity">
    <div class="avatar-wrap"><div class="avatar-ring"></div><div class="avatar"><div class="avatar-inner">🥷</div></div></div>
    <div class="char-name">KAGE<br>RYUU</div>
    <div class="char-clan"><span class="clan-dot"></span><span>Clan Uchiha</span><span class="clan-dot"></span></div>
    <div class="rank-badge">ANBU</div>
    <div class="identity-divider"></div>
    <div class="level-display"><div class="level-lbl">Nivel</div><div class="level-num">54</div><div class="xp-mini-bar"><div class="xp-mini-fill" style="width:67%"></div></div><div style="font-size:6px;color:var(--text-dim);">67,400 / 100K</div></div>
  </div>

  <div class="col-gear">
    <div class="gear-header"><div class="gear-title">⚔ Equipamiento</div><div class="gold-display"><span class="gold-icon">◆</span><span id="goldAmount">24,850</span></div></div>
    <div class="gear-grid" id="gearGrid"></div>
    <div class="extra-stats-area">
      <div class="transparent-line"></div>
      <div class="stats-extra-title">⚡ ESTADÍSTICAS BASE ⚡</div>
      <div id="extraStatsContainer" class="stats-extra-grid"></div>
    </div>
  </div>

  <div class="col-stats">
    <div class="stats-title">▸ Recursos</div>
    <div class="vital-bar-wrap" id="vitalBars"></div>
    <div class="stats-divider"></div>
    <div class="sprite-box" id="spriteBox">
      <div class="sprite-preview" id="spritePreview">
        <img id="spriteImage" alt="personaje sprite" style="display:none;">
        <div class="sprite-placeholder" id="spritePlaceholder">🎴<br>SIN SPRITE</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"><button class="modal-close" id="modalClose">✕</button><div class="modal-header"><div class="modal-icon" id="mIcon">⚔</div><div class="modal-title-group"><div class="modal-item-name" id="mName"></div><div class="modal-rarity" id="mRarity"></div></div></div><div class="modal-section"><div class="modal-section-title">Costo Mejora</div><div class="cost-row"><span class="cost-icon">◆</span><span class="cost-val" id="mCost"></span><span class="cost-lbl">ORO</span></div></div><div class="modal-section"><div class="modal-section-title">Comparativa</div><div class="compare-grid" id="compareGrid"></div></div><button class="btn-upgrade" id="btnUpgrade">▲ MEJORAR</button></div></div>
</div>
<script src="./script.js"></script>
</body>
</html>
