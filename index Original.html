<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Modern Shinobi Sheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --bg-dark: #0a0a0f;
    --glass: rgba(20, 25, 30, 0.65);
    --glass-border: rgba(255, 255, 255, 0.15);
    --neon-cyan: #00f3ff;
    --neon-gold: #ffd700;
    --text-main: #e0e6ed;
    --text-dim: #8a93a3;
    
    /* Rareza */
    --r-brown: #8b5a2b; --r-green: #00ff88; --r-blue: #00bfff;
    --r-yellow: #ffe600; --r-red: #ff3333; --r-legend: #ff3333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: var(--bg-dark);
    display: flex; justify-content: center; align-items: center;
    height: 100vh; font-family: 'Rajdhani', sans-serif; color: var(--text-main);
  }

  /* --- CONTENEDOR PRINCIPAL 460x360 --- */
  .ui-container {
    width: 460px; height: 360px;
    background: linear-gradient(145deg, #0f1218 0%, #050508 100%);
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 0 1px var(--glass-border);
    display: grid;
    grid-template-columns: 120px 1fr;
    grid-template-rows: 1fr auto;
    padding: 12px;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  /* Glassmorphism Base */
  .glass-panel {
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
  }

  /* --- COLUMNA IZQUIERDA (Identidad) --- */
  .col-identity {
    grid-row: 1 / 3;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 10px;
  }
  .avatar-frame {
    width: 80px; height: 80px; border-radius: 50%;
    border: 2px solid var(--neon-cyan);
    background: url('https://api.dicebear.com/7.x/bottts/svg?seed=ShinobiKaze') center/cover;
    box-shadow: 0 0 10px var(--neon-cyan);
  }
  .char-name { font-size: 20px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .char-clan { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
  .char-rank { 
    font-size: 14px; font-weight: 600; color: var(--neon-gold);
    padding: 2px 12px; border: 1px solid var(--neon-gold);
    border-radius: 4px; box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
  }

  /* --- COLUMNA CENTRAL (Equipo) --- */
  .col-gear {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; align-content: start;
  }
  .gear-slot {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 2px solid var(--glass-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s;
    position: relative; background: rgba(0,0,0,0.3);
  }
  .gear-slot:hover { transform: scale(1.05); border-color: var(--neon-cyan); }
  .gear-icon { font-size: 22px; margin-bottom: 2px; filter: drop-shadow(0 0 2px rgba(255,255,255,0.5)); }
  .gear-name { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
  .gear-lvl { position: absolute; bottom: 2px; right: 4px; font-size: 10px; font-weight: bold; color: #fff; }

  /* Rareza Visual (Bordes y Glow) */
  .rarity-1 { border-color: var(--r-brown); }
  .rarity-2 { border-color: var(--r-green); box-shadow: 0 0 6px var(--r-green); }
  .rarity-3 { border-color: var(--r-blue); box-shadow: 0 0 8px var(--r-blue); }
  .rarity-4 { border-color: var(--r-yellow); box-shadow: 0 0 10px var(--r-yellow); }
  .rarity-5 { border-color: var(--r-red); box-shadow: 0 0 12px var(--r-red); }
  .rarity-6 { 
    border: 2px solid var(--r-legend); 
    box-shadow: 0 0 15px var(--r-legend), inset 0 0 10px rgba(255, 215, 0, 0.4);
    animation: pulse-legend 2s infinite;
  }
  .rarity-6 .gear-icon { filter: drop-shadow(0 0 4px gold); }
  @keyframes pulse-legend { 0% {opacity: 0.9} 50% {opacity: 1; border-color: var(--neon-gold);} 100% {opacity: 0.9} }

  /* --- COLUMNA DERECHA/INFERIOR (Stats) --- */
  .col-stats {
    grid-column: 2;
    display: flex; flex-direction: column; gap: 6px;
  }
  .vitals { display: flex; flex-direction: column; gap: 4px; }
  .bar-row { display: flex; align-items: center; gap: 6px; }
  .bar-label { font-size: 11px; font-weight: 600; width: 40px; }
  .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
  .fill-hp { background: #00ff88; box-shadow: 0 0 8px #00ff88; width: 85%; }
  .fill-ch { background: #00bfff; box-shadow: 0 0 8px #00bfff; width: 60%; }
  .fill-exp { background: #e0e6ed; width: 45%; }

  .combat-stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
  }
  .stat-box {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,0.05); padding: 4px 2px; border-radius: 4px;
  }
  .stat-val { font-size: 13px; font-weight: 700; color: var(--neon-cyan); }
  .stat-lbl { font-size: 9px; color: var(--text-dim); margin-top: 2px; }

  /* --- MODAL DE MEJORA --- */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: 0.3s;
    z-index: 10;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  
  .modal-content {
    width: 280px;
    background: rgba(15, 20, 25, 0.95);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    border-radius: 8px; padding: 15px;
    text-align: center;
    transform: translateY(10px); transition: 0.3s;
  }
  .modal-overlay.active .modal-content { transform: translateY(0); }
  
  .modal-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .modal-level { font-size: 12px; color: var(--neon-gold); margin-bottom: 10px; }
  
  .cost-row { 
    display: flex; justify-content: center; align-items: center; gap: 5px;
    margin: 8px 0; font-size: 13px; color: var(--neon-gold);
  }
  
  .stat-compare {
    display: flex; justify-content: space-between;
    background: rgba(255,255,255,0.05); padding: 6px; border-radius: 4px;
    margin-bottom: 10px; font-size: 12px;
  }
  .stat-curr { color: var(--text-dim); }
  .stat-next { color: var(--r-green); font-weight: 700; }
  .stat-arrow { color: var(--text-dim); }

  .btn-upgrade {
    width: 100%; padding: 8px;
    background: linear-gradient(90deg, #00f3ff, #0066ff);
    border: none; border-radius: 4px;
    color: #000; font-weight: 800; font-size: 13px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    transition: 0.2s;
  }
  .btn-upgrade:hover { filter: brightness(1.2); box-shadow: 0 0 20px var(--neon-cyan); }
  .btn-close {
    position: absolute; top: 5px; right: 8px; cursor: pointer; color: var(--text-dim); font-size: 16px;
  }
</style>
</head>
<body>

<div class="ui-container">
  <!-- COLUMNA IZQUIERDA -->
  <div class="col-identity glass-panel">
    <div class="avatar-frame"></div>
    <div class="char-name">Kaze</div>
    <div class="char-clan">Clan Uzumaki</div>
    <div class="char-rank">JONIN</div>
  </div>

  <!-- COLUMNA CENTRAL: GEAR -->
  <div class="col-gear" id="gearGrid">
    <!-- Slots generados por JS -->
  </div>

  <!-- COLUMNA DERECHA: STATS & VITALS -->
  <div class="col-stats">
    <div class="vitals glass-panel" style="padding: 6px 10px;">
      <div class="bar-row"><span class="bar-label" style="color:#00ff88">HP</span><div class="bar-track"><div class="bar-fill fill-hp"></div></div></div>
      <div class="bar-row"><span class="bar-label" style="color:#00bfff">CHA</span><div class="bar-track"><div class="bar-fill fill-ch"></div></div></div>
      <div class="bar-row"><span class="bar-label" style="color:#fff">EXP</span><div class="bar-track"><div class="bar-fill fill-exp"></div></div></div>
    </div>

    <div class="combat-stats glass-panel" style="padding: 6px;">
      <div class="stat-box"><span class="stat-val">245</span><span class="stat-lbl">STR</span></div>
      <div class="stat-box"><span class="stat-val">310</span><span class="stat-lbl">AGI</span></div>
      <div class="stat-box"><span class="stat-val">180</span><span class="stat-lbl">INT</span></div>
      <div class="stat-box"><span class="stat-val">42</span><span class="stat-lbl">DEF</span></div>
      <div class="stat-box"><span class="stat-val">15</span><span class="stat-lbl">RES</span></div>
      <div class="stat-box"><span class="stat-val">8.5%</span><span class="stat-lbl">CRI</span></div>
    </div>
  </div>

  <!-- MODAL OVERLAY -->
  <div class="modal-overlay" id="upgradeModal">
    <div class="modal-content">
      <span class="btn-close" onclick="closeModal()">×</span>
      <div class="modal-title" id="mTitle">Katana de Viento</div>
      <div class="modal-level" id="mLevel">Nivel 12</div>
      
      <div class="cost-row">⚡ <span id="mCost">450</span> Oro</div>
      
      <div class="stat-compare">
        <div style="text-align:left"><div class="stat-lbl">Ataque</div><span class="stat-curr" id="sCurr">145</span></div>
        <div class="stat-arrow">➜</div>
        <div style="text-align:right"><div class="stat-lbl">Siguiente</div><span class="stat-next" id="sNext">168</span></div>
      </div>

      <button class="btn-upgrade" onclick="performUpgrade()">MEJORAR AHORA</button>
    </div>
  </div>
</div>

<script>
  // DATOS DE EQUIPO
  const gearData = [
    { id: 'main', name: 'Katana Fūjin', lvl: 48, rarity: 5, icon: '⚔️', statName: 'Fuerza' },
    { id: 'sec',  name: 'Shuriken Rayo', lvl: 22, rarity: 3, icon: '✴️', statName: 'Agilidad' },
    { id: 'head', name: 'Banda Clásica', lvl: 15, rarity: 2, icon: '🩹', statName: 'Resistencia' },
    { id: 'vest', name: 'Chaleco ANBU',  lvl: 55, rarity: 5, icon: '👕', statName: 'Defensa' },
    { id: 'hand', name: 'Guantes Tácticos',lvl: 65, rarity: 6, icon: '🧤', statName: 'Precisión' },
    { id: 'feet', name: 'Botas Sombra',  lvl: 8,  rarity: 2, icon: '👢', statName: 'Velocidad' }
  ];

  let currentSlot = null;

  // RENDERIZAR SLOTS
  const grid = document.getElementById('gearGrid');
  gearData.forEach((item, index) => {
    const slot = document.createElement('div');
    slot.className = `gear-slot rarity-${item.rarity}`;
    slot.innerHTML = `
      <div class="gear-icon">${item.icon}</div>
      <div class="gear-name">${item.name.split(' ')[0]}</div>
      <div class="gear-lvl">LVL ${item.lvl}</div>
    `;
    slot.onclick = () => openModal(index);
    grid.appendChild(slot);
  });

  // LÓGICA DEL MODAL
  const modal = document.getElementById('upgradeModal');
  const mTitle = document.getElementById('mTitle');
  const mLevel = document.getElementById('mLevel');
  const mCost = document.getElementById('mCost');
  const sCurr = document.getElementById('sCurr');
  const sNext = document.getElementById('sNext');

  function openModal(idx) {
    currentSlot = idx;
    const item = gearData[idx];
    const nextLvl = item.lvl + 1;
    
    mTitle.innerText = item.name;
    mLevel.innerText = `Nivel ${item.lvl}`;
    mCost.innerText = Math.floor(item.lvl * 15 + (item.lvl * item.lvl * 2)); // Fórmula escalable
    
    sCurr.innerText = `${item.lvl * 12}`;
    sNext.innerText = `${nextLvl * 12 + 5}`;
    
    modal.classList.add('active');
  }

  function closeModal() {
    modal.classList.remove('active');
  }

  function performUpgrade() {
    if(currentSlot === null) return;
    const item = gearData[currentSlot];
    
    // Lógica visual de actualización
    item.lvl++;
    if(item.lvl > 80) item.lvl = 80;
    
    // Recalcular rareza
    if(item.lvl <= 5) item.rarity = 1;
    else if(item.lvl <= 15) item.rarity = 2;
    else if(item.lvl <= 30) item.rarity = 3;
    else if(item.lvl <= 45) item.rarity = 4;
    else if(item.lvl <= 60) item.rarity = 5;
    else item.rarity = 6;

    closeModal();
    
    // Re-renderizar slot actualizado
    const slots = document.querySelectorAll('.gear-slot');
    const s = slots[currentSlot];
    s.className = `gear-slot rarity-${item.rarity}`;
    s.innerHTML = `
      <div class="gear-icon">${item.icon}</div>
      <div class="gear-name">${item.name.split(' ')[0]}</div>
      <div class="gear-lvl">LVL ${item.lvl}</div>
    `;
    
    // Efecto flash
    s.style.transform = "scale(1.1)";
    setTimeout(() => s.style.transform = "", 200);
  }
</script>

</body>
</html>
