<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naruto Idle RPG - Ranking Ninja</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d1117;
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: #e6edf3;
  overflow: hidden;
}

/* ==================== GAME CONTAINER ==================== */
#game-container {
  width: 460px;
  height: 360px;
  background: #0d1117;
  position: relative;
  overflow: hidden;
  border: 1px solid #1c2740;
  border-radius: 8px;
}

/* ==================== MENU DENTRO DEL CONTAINER ==================== */
#main-menu {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 40px;
  background: #0d1117;
  z-index: 50;
  transition: opacity 0.3s ease;
}
#main-menu.hidden {
  opacity: 0;
  pointer-events: none;
}
.menu-btn {
  padding: 10px 30px;
  font-size: 14px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: #131a26;
  color: #f0c040;
  border: 1px solid #f0c040;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.2s;
}
.menu-btn:hover {
  background: #f0c040;
  color: #0d1117;
}

/* ==================== GAME CONTENT (oculto al inicio) ==================== */
#game-content {
  display: none;
}
#game-content.visible {
  display: block;
}

/* TOP BAR */
#top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 6px;
  background: #131a26;
  height: 32px;
  border-bottom: 1px solid #1c2740;
}
.top-icon {
  cursor: pointer;
  position: relative;
  font-size: 16px;
  padding: 3px 7px;
  background: #162035;
  border-radius: 5px;
  border: 1px solid #1c2740;
  color: #f0c040;
  transition: all 0.2s;
}
.top-icon:hover { transform: scale(1.1); border-color: #f0c040; }
.badge {
  position: absolute;
  top: -3px; right: -3px;
  background: #ff4040;
  color: white;
  font-size: 8px;
  font-weight: bold;
  min-width: 14px;
  height: 14px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}
#player-info {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
}
#player-info span { color: #f0c040; font-weight: bold; }

/* EVENT TIMER BAR */
#event-timer-bar {
  text-align: center;
  padding: 2px;
  font-size: 9px;
  color: #ff8040;
  background: #131a26;
  border-bottom: 1px solid #1c2740;
  height: 20px;
  line-height: 16px;
}

/* PLAYER STATS BAR */
#player-stats-bar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 3px 6px;
  background: #1c2740;
  border-bottom: 1px solid #0d1117;
  height: 28px;
  gap: 4px;
}
.player-stat {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  font-weight: bold;
}
.player-stat.hp-stat { color: #ff6060; }
.player-stat.mp-stat { color: #60a0ff; }
.player-stat.atk-stat { color: #ff9040; }
.player-stat.def-stat { color: #40c0ff; }
.stat-bar-mini {
  width: 50px;
  height: 6px;
  background: #0d1117;
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}
.stat-bar-mini-fill-hp {
  height: 100%;
  background: linear-gradient(90deg, #ff4040, #ff8060);
  border-radius: 3px;
}
.stat-bar-mini-fill-mp {
  height: 100%;
  background: linear-gradient(90deg, #4060ff, #80a0ff);
  border-radius: 3px;
}

/* MAIN CONTENT */
#main-content {
  height: calc(360px - 32px - 20px - 28px - 96px);
  overflow-y: auto;
  padding: 3px 5px;
}
#main-content::-webkit-scrollbar { width: 3px; }
#main-content::-webkit-scrollbar-track { background: #131a26; }
#main-content::-webkit-scrollbar-thumb { background: #1c2740; border-radius: 2px; }

/* CHALLENGE CARDS */
.challenge-card {
  display: flex;
  align-items: center;
  background: #131a26;
  border: 1px solid #1c2740;
  border-radius: 5px;
  padding: 5px 7px;
  margin-bottom: 3px;
  cursor: pointer;
  transition: all 0.2s;
}
.challenge-card:hover { border-color: #f0c040; transform: translateX(2px); }
.challenge-card.selected { border-color: #40ff80; box-shadow: 0 0 8px rgba(64,255,128,0.3); }
.ninja-avatar {
  width: 40px;
  height: 40px;
  border-radius: 5px;
  background: #1c2740;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.1);
}
.ninja-details {
  flex: 1;
  margin-left: 6px;
  min-width: 0;
}
.ninja-name {
  font-size: 10px;
  font-weight: bold;
  color: #e6edf3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ninja-rank {
  font-size: 9px;
  color: #f0c040;
  font-weight: bold;
}
.ninja-rank.top1 { color: #ff4040; }
.ninja-rank.top3 { color: #ffcc00; }
.ninja-rank.top10 { color: #4080ff; }
.ninja-rank.top25 { color: #888; }
.ninja-stats {
  display: flex;
  gap: 4px;
  font-size: 8px;
  margin-top: 1px;
  flex-wrap: wrap;
}
.stat-chip {
  background: #1c2740;
  padding: 1px 4px;
  border-radius: 3px;
  color: #a0b0c0;
}
.stat-chip.hp { color: #ff6060; }
.stat-chip.atk { color: #ff9040; }
.stat-chip.def { color: #60a0ff; }
.ninja-rank-badge {
  font-size: 8px;
  padding: 2px 5px;
  border-radius: 3px;
  font-weight: bold;
}
.rank-genin { background: #408040; color: #a0ffa0; }
.rank-chunin { background: #4040a0; color: #a0a0ff; }
.rank-jonin { background: #a04040; color: #ffa0a0; }
.rank-anbu { background: #604080; color: #d0a0ff; }
.rank-kage { background: #808040; color: #ffff80; }

/* BOTTOM SECTION */
#bottom-section {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 96px;
  background: #131a26;
  border-top: 1px solid #1c2740;
  display: flex;
  flex-direction: column;
}
#combat-log {
  flex: 1;
  overflow-y: auto;
  padding: 4px 6px;
  font-size: 8px;
  height: 100%;
}
#combat-log::-webkit-scrollbar { width: 3px; }
#combat-log::-webkit-scrollbar-track { background: #131a26; }
#combat-log::-webkit-scrollbar-thumb { background: #1c2740; border-radius: 2px; }
.log-entry {
  padding: 2px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  display: flex;
  gap: 3px;
  align-items: center;
}
.log-entry.win { color: #40ff80; }
.log-entry.lose { color: #ff4040; }
.log-entry.neutral { color: #80a0c0; }
.log-time { color: #607080; min-width: 30px; }

/* OVERLAYS */
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(8, 12, 20, 0.92);
  display: none;
  flex-direction: column;
  z-index: 100;
  padding: 6px;
  overflow-y: auto;
}
.overlay.active { display: flex; }
.overlay-close {
  align-self: flex-end;
  background: #162035;
  border: 1px solid #1c2740;
  color: #e6edf3;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.overlay-title {
  font-size: 13px;
  font-weight: bold;
  color: #f0c040;
  text-align: center;
  margin: 3px 0 5px 0;
}
/* LEADERBOARD */
.lb-entry {
  display: flex;
  align-items: center;
  padding: 2px 5px;
  margin-bottom: 1.5px;
  border-radius: 3px;
  background: #131a26;
  font-size: 8.5px;
  gap: 3px;
}
.lb-entry.player-row { border: 1px solid #f0c040; }
.lb-pos { min-width: 20px; font-weight: bold; text-align: center; font-size: 8px; }
.lb-pos.p1 { color: #ff4040; }
.lb-pos.p2, .lb-pos.p3 { color: #ffcc00; }
.lb-pos.p10 { color: #4080ff; }
.lb-pos.p25 { color: #888; }
.lb-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-reward { color: #80a0c0; font-size: 7.5px; }
#lb-timer {
  text-align: center;
  font-size: 10px;
  color: #ff8040;
  font-weight: bold;
  margin-bottom: 5px;
  padding: 3px;
  background: #131a26;
  border-radius: 4px;
}
/* BATTLE SCREEN */
#battle-screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(8, 12, 20, 0.95);
  display: none;
  flex-direction: column;
  z-index: 200;
  padding: 5px;
}
#battle-screen.active { display: flex; }
.battle-field {
  flex: 1;
  display: flex;
  justify-content: space-around;
  align-items: center;
  gap: 6px;
}
.battle-fighter {
  text-align: center;
  width: 45%;
}
.battle-fighter .ninja-avatar {
  width: 50px;
  height: 50px;
  font-size: 28px;
  margin: 0 auto 3px auto;
}
.battle-fighter .fighter-name {
  font-size: 9px;
  font-weight: bold;
  margin-bottom: 1px;
}
.battle-fighter .fighter-rank {
  font-size: 8px;
  color: #f0c040;
  margin-bottom: 3px;
}
.bar-container {
  width: 100%;
  height: 8px;
  background: #0d1117;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 1.5px;
  border: 1px solid rgba(255,255,255,0.1);
}
.bar-hp { height: 100%; background: linear-gradient(90deg, #ff4040, #ff8060); transition: width 0.3s; }
.bar-mp { height: 100%; background: linear-gradient(90deg, #4060ff, #80a0ff); transition: width 0.3s; }
.bar-label {
  font-size: 7px;
  color: #a0b0c0;
  display: flex;
  justify-content: space-between;
}
.fighter-stats {
  display: flex;
  gap: 3px;
  justify-content: center;
  margin-top: 3px;
}
.fighter-stats .stat-chip { font-size: 7px; }
#battle-log {
  height: 45px;
  overflow-y: auto;
  font-size: 7.5px;
  padding: 2px;
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  margin-top: 3px;
}
#battle-log::-webkit-scrollbar { width: 2px; }
#battle-log::-webkit-scrollbar-thumb { background: #1c2740; }
.battle-msg { padding: 0.5px 0; }
.battle-msg.dmg { color: #ff6040; }
.battle-msg.heal { color: #40ff80; }
.battle-msg.info { color: #80a0c0; }
/* WIN/LOSE OVERLAY */
#result-overlay {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  padding: 14px 28px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  z-index: 300;
  display: none;
  text-align: center;
  min-width: 160px;
}
#result-overlay.active { display: block; }
#result-overlay.win {
  background: rgba(40, 255, 80, 0.2);
  border: 2px solid #40ff80;
  color: #40ff80;
  text-shadow: 0 0 10px #40ff80;
}
#result-overlay.lose {
  background: rgba(255, 40, 40, 0.2);
  border: 2px solid #ff4040;
  color: #ff4040;
  text-shadow: 0 0 10px #ff4040;
}
/* NOTIFICATION PANEL */
.notif-entry {
  padding: 3px 5px;
  margin-bottom: 2px;
  border-radius: 3px;
  font-size: 8.5px;
  background: #131a26;
  border-left: 3px solid;
}
.notif-entry.win { border-color: #40ff80; color: #40ff80; }
.notif-entry.lose { border-color: #ff4040; color: #ff4040; }
</style>
</head>
<body>

<div id="game-container">

  <!-- ==================== MENU: Botón dentro del mismo cuadro ==================== -->
  <div id="main-menu">
    <button class="menu-btn" onclick="enterGame()">⚔️ BATALLA NINJA</button>
  </div>

  <!-- ==================== GAME CONTENT: Todo el juego ==================== -->
  <div id="game-content">
    <!-- TOP BAR -->
    <div id="top-bar">

      </div>

      <div class="overlay-title">💬 NOTIFICACIONES DE COMBATE</div>
      <div id="notif-list"></div>
    </div>

    <!-- BATTLE SCREEN -->
    <div id="battle-screen">
      <div class="battle-field">
        <div class="battle-fighter" id="player-fighter"></div>
        <div style="font-size:20px;color:#ff4040">⚔️</div>
        <div class="battle-fighter" id="enemy-fighter"></div>
      </div>
      <div id="battle-log"></div>
      <div id="result-overlay"></div>
    </div>
  </div>

</div>

let gameState = {
  player: {
    name: "Tú",
    rank: 101,
    level: 7,
    hp: 200, maxHp: 200,
    mp: 50, maxMp: 50,
    atk: 30, def: 15, spd: 100, crt: 10, eva: 8, res: 60,
    formulaIdx: 0,
    emoji: "🥷"
  },
  ninjas: [],
  selectedEnemy: null,
  combatLog: [],
  notifications: [],
  notifCount: 0,
  eventTime: 24 * 60 * 60,
  battleActive: false,
  ninjaFirstAttackDone: {},
  battleIntervals: {}
};

// ==================== INITIALIZATION ====================
function init() {
  let usedNames = new Set();
  for (let i = 1; i <= 100; i++) {
    let nameIdx = (i - 1) % NINJA_NAMES.length;
    let name = NINJA_NAMES[nameIdx];
    let attempts = 0;
    while (usedNames.has(name) && attempts < 200) {
      nameIdx = (nameIdx + 1) % NINJA_NAMES.length;
      name = NINJA_NAMES[nameIdx];
      attempts++;
    }
    usedNames.add(name);

    let minLevel = gameState.player.level;
    let maxLevel = 100;
    let level = Math.floor(Math.random() * (maxLevel - minLevel + 1)) + minLevel;
    
    let formulaIdx = Math.floor(Math.random() * STAT_FORMULAS.length);
    let formula = STAT_FORMULAS[formulaIdx];
    let rankClassIdx = Math.floor(Math.random() * RANKS.length);
    let emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    let baseHp = Math.floor(formula.hp(level));
    
    let ninja = {
      rank: i,
      name: name,
      level: level,
      hp: baseHp,
      maxHp: baseHp,
      hpDisplay: baseHp * 6,
      maxHpDisplay: baseHp * 6,
      atk: Math.floor(formula.atk(level)),
      def: Math.floor(formula.def(level)),
      spd: Math.floor(formula.spd(level)),
      crt: Math.floor(formula.crt(level)),
      eva: Math.floor(formula.eva(level)),
      res: Math.floor(formula.res(level)),
      formulaIdx: formulaIdx,
      rankClass: RANKS[rankClassIdx],
      rankClassIdx: rankClassIdx,
      emoji: emoji,
      nextAttackTime: Math.floor(Math.random() * 3540) + 60,
      firstAttackDone: false
    };

    gameState.ninjas.push(ninja);
  }

  gameState.player.formulaIdx = Math.floor(Math.random() * STAT_FORMULAS.length);
  let pf = STAT_FORMULAS[gameState.player.formulaIdx];
  let playerBaseHp = Math.floor(pf.hp(gameState.player.level));
  gameState.player.hp = playerBaseHp;
  gameState.player.maxHp = playerBaseHp;
  gameState.player.hpDisplay = playerBaseHp * 6;
  gameState.player.maxHpDisplay = playerBaseHp * 6;
  gameState.player.atk = Math.floor(pf.atk(gameState.player.level));
  gameState.player.def = Math.floor(pf.def(gameState.player.level));

  updatePlayerStatsDisplay();
  renderChallengeCards();
  updatePlayerDisplay();
  startEventTimer();
  startNinjaAI();
}

// ==================== PLAYER STATS DISPLAY ====================
function updatePlayerStatsDisplay() {
  let p = gameState.player;
  document.getElementById('p-hp-display').textContent = p.hpDisplay;
  document.getElementById('p-mp-display').textContent = p.mp;
  document.getElementById('p-atk-display').textContent = p.atk;
  document.getElementById('p-def-display').textContent = p.def;

  let hpPct = (p.hpDisplay / p.maxHpDisplay) * 100;
  let mpPct = (p.mp / p.maxMp) * 100;
  document.getElementById('p-hp-bar-mini').style.width = hpPct + '%';
  document.getElementById('p-mp-bar-mini').style.width = mpPct + '%';
}

// ==================== RENDERING ====================
function getRankColorClass(rank) {
  if (rank === 1) return 'top1';
  if (rank <= 3) return 'top3';
  if (rank <= 10) return 'top10';
  if (rank <= 25) return 'top25';
  return '';
}

function renderChallengeCards() {
  const container = document.getElementById('main-content');
  container.innerHTML = '';

  let targets = [];
  for (let r = gameState.player.rank - 3; r < gameState.player.rank; r++) {
    if (r < 1) continue;
    let ninja = gameState.ninjas.find(n => n.rank === r);
    if (ninja) targets.push(ninja);
  }

  if (targets.length < 3) {
    let remaining = 3 - targets.length;
    let topNinjas = gameState.ninjas
      .filter(n => !targets.includes(n))
      .sort((a, b) => a.rank - b.rank)
      .slice(0, remaining);
    targets = [...targets, ...topNinjas];
  }

  targets.forEach(ninja => {
    let card = document.createElement('div');
    card.className = 'challenge-card';
    card.dataset.rank = ninja.rank;
    card.onclick = () => selectEnemy(ninja);

    let rankColorClass = getRankColorClass(ninja.rank);

    card.innerHTML = `
      <div class="ninja-avatar">${ninja.emoji}</div>
      <div class="ninja-details">
        <div class="ninja-name">${ninja.name}</div>
        <div class="ninja-rank ${rankColorClass}">#${ninja.rank} · ${ninja.rankClass} · Lv.${ninja.level}</div>
        <div class="ninja-stats">
          <span class="stat-chip hp">❤️ ${ninja.hpDisplay}</span>
          <span class="stat-chip atk">⚔️ ${ninja.atk}</span>
          <span class="stat-chip def">🛡️ ${ninja.def}</span>
        </div>
      </div>
      <span class="ninja-rank-badge ${RANK_CLASSES[ninja.rankClassIdx]}">${ninja.rankClass}</span>
    `;
    container.appendChild(card);
  });
}

function selectEnemy(ninja) {
  if (gameState.battleActive) return;
  
  gameState.selectedEnemy = ninja;
  
  document.querySelectorAll('.challenge-card').forEach(c => c.classList.remove('selected'));
  let el = document.querySelector(`.challenge-card[data-rank="${ninja.rank}"]`);
  if (el) el.classList.add('selected');
  
  startBattle();
}

function updatePlayerDisplay() {
  document.getElementById('player-rank').textContent = `#${gameState.player.rank}`;
  document.getElementById('player-level').textContent = gameState.player.level;
  document.getElementById('player-name').textContent = gameState.player.name;
}

// ==================== BATTLE SYSTEM ====================
function startBattle() {
  if (!gameState.selectedEnemy || gameState.battleActive) return;

  let enemy = gameState.selectedEnemy;
  let player = gameState.player;
  gameState.battleActive = true;

  let playerBattleHp = player.hpDisplay;
  let playerMaxBattleHp = player.maxHpDisplay;
  let enemyBattleHp = enemy.hpDisplay;
  let enemyMaxBattleHp = enemy.maxHpDisplay;

  document.getElementById('battle-screen').classList.add('active');
  document.getElementById('result-overlay').className = '';
  document.getElementById('result-overlay').style.display = 'none';

  let battleLog = document.getElementById('battle-log');
  battleLog.innerHTML = '';

  document.getElementById('player-fighter').innerHTML = `
    <div class="ninja-avatar">${player.emoji}</div>
    <div class="fighter-name">${player.name}</div>
    <div class="fighter-rank">#${player.rank} · ${player.level} Lv.</div>
    <div class="bar-label"><span>HP x6</span><span id="p-hp-text">${playerBattleHp}/${playerMaxBattleHp}</span></div>
    <div class="bar-container"><div class="bar-hp" id="p-hp-bar" style="width:100%"></div></div>
    <div class="bar-label"><span>MP</span><span id="p-mp-text">${player.mp}/${player.maxMp}</span></div>
    <div class="bar-container"><div class="bar-mp" id="p-mp-bar" style="width:${(player.mp/player.maxMp)*100}%"></div></div>
    <div class="fighter-stats">
      <span class="stat-chip atk">⚔️ ${player.atk}</span>
      <span class="stat-chip def">🛡️ ${player.def}</span>
    </div>
  `;

  document.getElementById('enemy-fighter').innerHTML = `
    <div class="ninja-avatar">${enemy.emoji}</div>
    <div class="fighter-name">${enemy.name}</div>
    <div class="fighter-rank">#${enemy.rank} · ${enemy.rankClass} · Lv.${enemy.level}</div>
    <div class="bar-label"><span>HP x6</span><span id="e-hp-text">${enemyBattleHp}/${enemyMaxBattleHp}</span></div>
    <div class="bar-container"><div class="bar-hp" id="e-hp-bar" style="width:100%"></div></div>
    <div class="bar-label"><span>MP</span><span id="e-mp-text">${enemy.maxMp||50}/50</span></div>
    <div class="bar-container"><div class="bar-mp" id="e-mp-bar" style="width:100%"></div></div>
    <div class="fighter-stats">
      <span class="stat-chip atk">⚔️ ${enemy.atk}</span>
      <span class="stat-chip def">🛡️ ${enemy.def}</span>
    </div>
  `;

  let pHp = playerBattleHp;
  let eHp = enemyBattleHp;

  let jutsus = ["Rasengan! 🌀","Chidori! ⚡","Katon! 🔥","Shadow Clone! 👥","Byakugan! 👁️","Eight Gates! 💥","Summoning! 🐸","Sage Mode! 🌿","Tailed Beast! 🦊","Puppet Jutsu! 🎭","Kirin! ⚡","Amaterasu! 🔥","Susanoo! 👻","Kage Bunshin! 🌀","Rasenshuriken! 🌪️"];

  function doTurn() {
    if (pHp <= 0 || eHp <= 0) {
      endBattle(pHp > 0, enemy);
      return;
    }

    let pDmg = Math.max(1, player.atk - Math.floor(enemy.def * 0.5) + Math.floor(Math.random() * 10));
    let eDmg = Math.max(1, enemy.atk - Math.floor(player.def * 0.5) + Math.floor(Math.random() * 10));

    let pJutsu = jutsus[Math.floor(Math.random() * jutsus.length)];
    eHp -= pDmg;
    addBattleLog(`${player.name} usó ${pJutsu} → -${pDmg} DMG`, 'dmg');

    updateHpBars(pHp, eHp, playerMaxBattleHp, enemyMaxBattleHp);

    if (eHp <= 0) {
      eHp = 0;
      updateHpBars(pHp, 0, playerMaxBattleHp, enemyMaxBattleHp);
      endBattle(true, enemy);
      return;
    }

    setTimeout(() => {
      let eJutsu = jutsus[Math.floor(Math.random() * jutsus.length)];
      pHp -= eDmg;
      addBattleLog(`${enemy.name} usó ${eJutsu} → -${eDmg} DMG`, 'dmg');
      updateHpBars(pHp, eHp, playerMaxBattleHp, enemyMaxBattleHp);

      if (pHp <= 0) {
        pHp = 0;
        updateHpBars(0, eHp, playerMaxBattleHp, enemyMaxBattleHp);
        endBattle(false, enemy);
      }
    }, 350);
  }

  let battleInterval = setInterval(() => {
    if (!gameState.battleActive) { clearInterval(battleInterval); return; }
    doTurn();
  }, 700);

  setTimeout(doTurn, 250);
}

function updateHpBars(pHp, eHp, pMax, eMax) {
  let pPct = Math.max(0, (pHp / pMax) * 100);
  let ePct = Math.max(0, (eHp / eMax) * 100);
  let pEl = document.getElementById('p-hp-bar');
  let eEl = document.getElementById('e-hp-bar');
  if (pEl) pEl.style.width = pPct + '%';
  if (eEl) eEl.style.width = ePct + '%';
  let ptEl = document.getElementById('p-hp-text');
  let etEl = document.getElementById('e-hp-text');
  if (ptEl) ptEl.textContent = `${Math.max(0,Math.floor(pHp))}/${pMax}`;
  if (etEl) etEl.textContent = `${Math.max(0,Math.floor(eHp))}/${eMax}`;
}

function addBattleLog(msg, cls) {
  let log = document.getElementById('battle-log');
  let entry = document.createElement('div');
  entry.className = `battle-msg ${cls}`;
  entry.textContent = `⚡ ${msg}`;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function endBattle(won, enemy) {
  gameState.battleActive = false;

  let resultOverlay = document.getElementById('result-overlay');
  if (won) {
    resultOverlay.className = 'win active';
    resultOverlay.textContent = '🏆 ¡GANASTE! 🏆';
    resultOverlay.style.display = 'block';

    let oldPlayerRank = gameState.player.rank;
    let oldEnemyRank = enemy.rank;

    gameState.player.rank = oldEnemyRank;
    enemy.rank = oldPlayerRank;
    gameState.ninjas.sort((a, b) => a.rank - b.rank);

    if (Math.random() < 0.1) {
      enemy.level = Math.min(100, enemy.level + Math.floor(Math.random() * 5) + 1);
      let f = STAT_FORMULAS[enemy.formulaIdx];
      let newBaseHp = Math.floor(f.hp(enemy.level));
      enemy.hp = newBaseHp;
      enemy.maxHp = newBaseHp;
      enemy.hpDisplay = newBaseHp * 6;
      enemy.maxHpDisplay = newBaseHp * 6;
      enemy.atk = Math.floor(f.atk(enemy.level));
      enemy.def = Math.floor(f.def(enemy.level));
      addCombatLog(`📚 ${enemy.name} entrenó → Lv.${enemy.level}!`, 'neutral');
    }

    addCombatLog(`✅ ${gameState.player.name} venció a ${enemy.name} (#${oldEnemyRank}→#${gameState.player.rank})`, 'win');
    addNotification(`${enemy.name} te atacó pero defendiste tu puesto al rango #${gameState.player.rank}`, 'win');
  } else {
    resultOverlay.className = 'lose active';
    resultOverlay.textContent = '💀 PERDISTE 💀';
    resultOverlay.style.display = 'block';

    let newRank = Math.min(101, gameState.player.rank + Math.floor(Math.random() * 5) + 1);
    addCombatLog(`❌ ${gameState.player.name} perdió vs ${enemy.name} → Rango #${newRank}`, 'lose');
    addNotification(`${enemy.name} te atacó y bajaste al rango #${newRank}`, 'lose');
  }

  updatePlayerDisplay();
  updatePlayerStatsDisplay();
  renderChallengeCards();

  setTimeout(() => {
    document.getElementById('battle-screen').classList.remove('active');
    resultOverlay.className = '';
    resultOverlay.style.display = 'none';
    gameState.selectedEnemy = null;
  }, 3000);
}

// ==================== COMBAT LOG ====================
function addCombatLog(msg, type) {
  let now = new Date();
  let time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;

  gameState.combatLog.unshift({ time, msg, type });
  if (gameState.combatLog.length > 8) gameState.combatLog.pop();

  renderCombatLog();
}

function renderCombatLog() {
  let logEl = document.getElementById('combat-log');
  logEl.innerHTML = '<div style="text-align:center;color:#607080;font-size:7px;padding:1px;">📜 Últimos Combates entre Ninjas</div>';

  gameState.combatLog.forEach(entry => {
    let div = document.createElement('div');
    div.className = `log-entry ${entry.type}`;
    div.innerHTML = `<span class="log-time">${entry.time}</span><span>${entry.msg}</span>`;
    logEl.appendChild(div);
  });
}

// ==================== NOTIFICATIONS ====================
function addNotification(msg, type) {
  gameState.notifications.unshift({ msg, type, read: false });
  gameState.notifCount = gameState.notifications.filter(n => !n.read).length;

  let badge = document.getElementById('msg-badge');
  if (gameState.notifCount > 0) {
    badge.style.display = 'flex';
    badge.textContent = gameState.notifCount;
  }
}

function toggleMessages() {
  let overlay = document.getElementById('messages-overlay');
  overlay.classList.toggle('active');

  if (overlay.classList.contains('active')) {
    let list = document.getElementById('notif-list');
    list.innerHTML = '';

    if (gameState.notifications.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:#607080;font-size:9px;padding:20px;">Sin notificaciones 💤</div>';
    } else {
      gameState.notifications.forEach(n => {
        let div = document.createElement('div');
        div.className = `notif-entry ${n.type}`;
        div.innerHTML = `${n.type === 'win' ? '🏆' : '💀'} ${n.msg}`;
        list.appendChild(div);
        n.read = true;
      });
    }

    gameState.notifCount = 0;
    document.getElementById('msg-badge').style.display = 'none';
  }
}

  let overlay = document.getElementById('leaderboard-overlay');

  if (overlay.classList.contains('active')) {
    renderLeaderboard();

    let rewards = getRewards(ninja.rank);

    entry.innerHTML = `
      <span class="lb-pos ${rankClass}">#${ninja.rank}</span>
      <span style="font-size:11px">${ninja.emoji}</span>
      <span class="lb-name">${ninja.name}</span>
      <span style="color:#607080;font-size:7px">Lv.${ninja.level}</span>
      <span class="lb-reward">${rewards}</span>
    `;
    list.appendChild(entry);
  });
}

function getRewards(rank) {
  if (rank === 1) return '💰15K ⭐25';
  if (rank <= 3) return '💰10K ⭐15';
  if (rank <= 10) return '💰4K ⭐6';
  if (rank <= 25) return '💰1K ⭐2';
  if (rank <= 70) return '💰300';
  return '';
}

// ==================== EVENT TIMER ====================
function startEventTimer() {
  setInterval(() => {
    if (gameState.eventTime > 0) {
      gameState.eventTime--;
    }

    let h = Math.floor(gameState.eventTime / 3600);
    let m = Math.floor((gameState.eventTime % 3600) / 60);
    let s = gameState.eventTime % 60;
    let timeStr = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;

    document.getElementById('event-timer').textContent = timeStr;
    document.getElementById('lb-countdown').textContent = timeStr;

    if (gameState.eventTime <= 0) {
      document.getElementById('event-timer').textContent = '🏁 FINALIZADO';
    }
  }, 1000);
}

// ==================== NINJA AI ====================
function startNinjaAI() {
  setInterval(() => {
    gameState.ninjas.forEach(ninja => {
      ninja.nextAttackTime--;

      if (ninja.nextAttackTime <= 0) {
        let validTargets = gameState.ninjas.filter(n =>
          n.rank >= ninja.rank - 3 && n.rank < ninja.rank && n.rank !== ninja.rank
        );

        if (validTargets.length > 0) {
          let target = validTargets[Math.floor(Math.random() * validTargets.length)];
          simulateNinjaFight(ninja, target);
        }

        if (!ninja.firstAttackDone) {
          ninja.firstAttackDone = true;
          ninja.nextAttackTime = 7200;
        } else {
          ninja.nextAttackTime = 7200;
        }
      }
    });

    if (!gameState.battleActive) {
      renderChallengeCards();
    }
  }, 1000);
}

function simulateNinjaFight(attacker, defender) {
  let attackPower = attacker.atk * 2 + attacker.spd * 0.3 + attacker.crt * 0.5;
  let defensePower = defender.def * 2 + defender.res * 0.3 + defender.eva * 0.5;

  attackPower *= (0.7 + Math.random() * 0.6);
  defensePower *= (0.7 + Math.random() * 0.6);

  if (attackPower > defensePower) {
    let tempRank = attacker.rank;
    attacker.rank = defender.rank;
    defender.rank = tempRank;

    gameState.ninjas.sort((a, b) => a.rank - b.rank);

    addCombatLog(`⚔️ ${attacker.emoji} ${attacker.name} venció a ${defender.emoji} ${defender.name} (#${tempRank}→#${attacker.rank})`, 'win');

    if (defender.rank === gameState.player.rank) {
      let newPlayerRank = Math.min(101, gameState.player.rank + 1);
      addNotification(`${attacker.name} te atacó y bajaste al rango #${newPlayerRank}`, 'lose');
    }
  } else {
    addCombatLog(`🛡️ ${defender.emoji} ${defender.name} defendió su puesto vs ${attacker.emoji} ${attacker.name}`, 'neutral');

    if (defender.rank === gameState.player.rank) {
      addNotification(`${attacker.name} te atacó pero defendiste tu puesto #${gameState.player.rank}`, 'win');
    }
  }

  if (Math.random() < 0.1) {
    let loser = attackPower > defensePower ? defender : attacker;
    loser.level = Math.min(100, loser.level + Math.floor(Math.random() * 3) + 1);
    let f = STAT_FORMULAS[loser.formulaIdx];
    let newBaseHp = Math.floor(f.hp(loser.level));
    loser.hp = newBaseHp;
    loser.maxHp = newBaseHp;
    loser.hpDisplay = newBaseHp * 6;
    loser.maxHpDisplay = newBaseHp * 6;
    loser.atk = Math.floor(f.atk(loser.level));
    loser.def = Math.floor(f.def(loser.level));
    addCombatLog(`📚 ${loser.name} entrenó → Lv.${loser.level}!`, 'neutral');
  }
}
